{% extends "base.html" %}
{% block content %}
<div class="dashboard-grid">
    <div class="stat-card">
        <h3>Total Users</h3>
        <p id="stat-users">-</p>
    </div>
    <div class="stat-card">
        <h3>Open Incidents</h3>
        <p id="stat-incidents">-</p>
    </div>
    <div class="stat-card">
        <h3>Pending Bookings</h3>
        <p id="stat-bookings">-</p>
    </div>

<div class="quick-actions">
    <a href="{{ url_for('map_editor') }}" class="btn">Manage Map</a>
    <a href="{{ url_for('page_incidents') }}" class="btn">View Incidents</a>
    <a href="{{ url_for('page_bookings') }}" class="btn">Approve Bookings</a>
</div>
{% endblock %}

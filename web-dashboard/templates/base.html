<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSNS - Security Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
    <nav class="navbar">
        <div class="brand">SSNS Admin</div>
        <div class="links">
            {% if session.get('user_id') %}
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('map_editor') }}">Map</a>
            <a href="{{ url_for('page_incidents') }}">Incidents</a>
            <a href="{{ url_for('page_bookings') }}">Bookings</a>
            <a href="{{ url_for('page_users') }}">Users</a>
            <a href="{{ url_for('page_analytics') }}">Analytics</a>
            <a href="#" onclick="logout()">Logout</a>
            {% else %}
            <a href="{{ url_for('login') }}">Login</a>
            {% endif %}
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>

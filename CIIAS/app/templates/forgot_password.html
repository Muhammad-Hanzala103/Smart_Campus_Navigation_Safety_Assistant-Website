<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIIAS - Password Recovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
        }

        .blob {
            position: fixed;
            width: 500px;
            height: 500px;
            background: linear-gradient(to right, #6366f1, #a855f7);
            filter: blur(80px);
            opacity: 0.1;
            border-radius: 50%;
            z-index: -1;
            animation: move 30s infinite alternate;
        }

        @keyframes move {
            from {
                transform: translate(-20%, 0);
            }

            to {
                transform: translate(20%, 0);
            }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">
    <div class="bg-mesh"></div>
    <div class="blob"></div>

    <div class="w-full max-w-md relative">
        <!-- Back to Home -->
        <a href="{{ url_for('web.index') }}"
            class="absolute -top-16 left-0 text-gray-400 hover:text-white transition-all flex items-center gap-2 font-bold text-xs uppercase tracking-widest group">
            <i class="fas fa-arrow-left group-hover:-translate-x-1 transition-transform"></i> Return to Terminal
        </a>

        <div class="glass p-10 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
            <!-- Header -->
            <div class="text-center mb-10">
                <div
                    class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-indigo-500/20 mb-6">
                    <i class="fas fa-key-skeleton text-3xl text-white"></i>
                </div>
                <h1 class="text-3xl font-black text-white tracking-tight mb-2">Recovery</h1>
                <p class="text-gray-400 text-sm font-medium">Cipher Reset Authorization</p>
            </div>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div
                class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-500 p-4 rounded-xl text-xs font-bold mb-6 flex items-center gap-3">
                <i class="fas fa-circle-check text-lg"></i> {{ messages[0] }}
            </div>
            {% endif %}
            {% endwith %}

            <form method="POST" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest ml-1">Identity
                        Uplink</label>
                    <div class="relative">
                        <i class="fas fa-at absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                        <input type="email" name="email" required
                            class="w-full bg-slate-900/50 border border-white/5 rounded-2xl pl-12 pr-4 py-4 text-white placeholder:text-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all font-medium"
                            placeholder="your@university.edu">
                    </div>
                </div>

                <button type="submit"
                    class="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-black rounded-2xl hover:shadow-lg hover:shadow-indigo-500/30 transform hover:-translate-y-1 transition-all uppercase tracking-widest text-sm">
                    Send Reset Pulse
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-white/5 text-center">
                <a href="{{ url_for('web.login') }}"
                    class="text-xs font-bold text-gray-400 hover:text-white transition-colors flex items-center justify-center gap-2">
                    <i class="fas fa-arrow-left text-[10px]"></i> Back to Login Terminal
                </a>
            </div>
        </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIIAS - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ciias.css') }}">
</head>

<body>
    <div class="auth-page">
        <div class="auth-header">
            <h1>CIIAS</h1>
            <p>Password Recovery</p>
        </div>

        <div class="auth-card">
            <h2>Reset Password</h2>
            <p class="subtitle">Enter your email to receive reset instructions</p>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div
                style="background:#dcfce7;color:#166534;padding:0.75rem;border-radius:6px;margin-bottom:1rem;font-size:0.9rem;">
                {{ messages[0] }}</div>
            {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="your.email@university.edu"
                        required>
                </div>
                <button type="submit" class="btn-primary">Send Reset Link</button>
            </form>

            <div class="auth-links">
                <a href="{{ url_for('web.login') }}">← Back to Login</a>
            </div>
        </div>
    </div>
</body>

</html>

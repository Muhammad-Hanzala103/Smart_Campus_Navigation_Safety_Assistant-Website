{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="page-container" style="max-width:800px;">
    <div class="page-header">
        <h1>My Profile</h1>
        <p>Manage your account settings</p>
    </div>

    <div class="info-card" style="margin-bottom:1.5rem;">
        <div style="display:flex;align-items:center;gap:1.5rem;margin-bottom:1.5rem;">
            <div class="user-avatar" style="width:80px;height:80px;font-size:2rem;">{{ user.name[0] }}</div>
            <div>
                <h2 style="margin:0;">{{ user.name }}</h2>
                <p style="color:var(--text-light);margin:0.25rem 0;">{{ user.email }}</p>
                <span class="role-badge">{{ user.role.upper() }}</span>
            </div>
        </div>

        <form method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" class="form-control" value="{{ user.email }}" disabled>
                <small style="color:var(--text-light);">Contact admin to change email</small>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" class="form-control" value="{{ user.phone or '' }}"
                    placeholder="+92 300 1234567">
            </div>

            <hr style="margin:1.5rem 0;border:none;border-top:1px solid #e5e7eb;">

            <h3 style="margin-bottom:1rem;">Change Password</h3>
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" name="current_password" class="form-control"
                    placeholder="Enter current password">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_password" class="form-control" placeholder="Enter new password">
            </div>

            <button type="submit" class="btn-primary" style="margin-top:1rem;">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}

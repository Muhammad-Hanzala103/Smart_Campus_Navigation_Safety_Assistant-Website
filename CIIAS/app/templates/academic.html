{% extends "base_dashboard.html" %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Academic Portal</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <div class="btn-group me-2">
            <button type="button" class="btn btn-sm btn-outline-secondary">Export Results</button>
            <button type="button" class="btn btn-sm btn-outline-secondary">Manage Courses</button>
        </div>
    </div>
</div>

<ul class="nav nav-tabs mb-4" id="academicTab" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="results-tab" data-bs-toggle="tab" data-bs-target="#results" type="button"
            role="tab" aria-controls="results" aria-selected="true">Student Results</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="courses-tab" data-bs-toggle="tab" data-bs-target="#courses" type="button"
            role="tab" aria-controls="courses" aria-selected="false">Enrolled Courses</button>
    </li>
</ul>

<div class="tab-content" id="academicTabContent">
    <div class="tab-pane fade show active" id="results" role="tabpanel" aria-labelledby="results-tab">
        <div class="table-responsive">
            <h5 class="mt-3">Semester: <span id="currentSemester">Loading...</span> | CGPA: <span
                    id="currentCGPA">...</span></h5>
            <table class="table table-striped table-sm" id="resultsTable">
                <thead>
                    <tr>
                        <th scope="col">Course Code</th>
                        <th scope="col">Course Name</th>
                        <th scope="col">Semester</th>
                        <th scope="col">Grade</th>
                        <th scope="col">Status</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                    <!-- Data will be loaded via JS -->
                    <tr>
                        <td colspan="5">Loading results...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="tab-pane fade" id="courses" role="tabpanel" aria-labelledby="courses-tab">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Enrolled Courses</h5>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Title</th>
                                <th>Instructor</th>
                                <th>Credits</th>
                            </tr>
                        </thead>
                        <tbody id="coursesBody">
                            <tr>
                                <td colspan="4">Loading courses...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        loadAcademicData();
    });

    function loadAcademicData() {
        fetch('/api/academic/results')
            .then(response => {
                if (!response.ok) throw new Error("Failed to fetch");
                return response.json();
            })
            .then(data => {
                // Update Header
                document.getElementById('currentCGPA').textContent = data.cgpa;
                document.getElementById('currentSemester').textContent = data.semester;

                // Update Results Table
                const tbody = document.getElementById('resultsBody');
                tbody.innerHTML = '';
                const coursesBody = document.getElementById('coursesBody'); // Reuse data for courses tab for now
                coursesBody.innerHTML = '';

                if (data.results && data.results.length > 0) {
                    data.results.forEach(item => {
                        // Results Row
                        const row = `<tr>
                    <td>${item.course_code}</td>
                    <td>${item.course_name}</td>
                    <td>${item.semester}</td>
                    <td class="fw-bold ${getGradeColor(item.grade)}">${item.grade}</td>
                    <td>${item.grade === 'In Progress' ? 'Ongoing' : 'Completed'}</td>
                </tr>`;
                        tbody.insertAdjacentHTML('beforeend', row);

                        // Courses Row (using same data for demo)
                        const cRow = `<tr>
                    <td>${item.course_code}</td>
                    <td>${item.course_name}</td>
                    <td>TBD</td> <!-- Instructor not in result payload, simplified -->
                    <td>3</td>
                </tr>`;
                        coursesBody.insertAdjacentHTML('beforeend', cRow);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5">No results found.</td></tr>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('resultsBody').innerHTML = '<tr><td colspan="5" class="text-danger">Error loading data. Please try again.</td></tr>';
            });
    }

    function getGradeColor(grade) {
        if (grade.startsWith('A')) return 'text-success';
        if (grade.startsWith('B')) return 'text-primary';
        if (grade.startsWith('C')) return 'text-warning';
        if (grade.startsWith('F')) return 'text-danger';
        return '';
    }
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIIAS - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ciias.css') }}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-header">
            <h1>CIIAS</h1>
            <p>Create your account</p>
        </div>

        <div class="auth-card">
            <h2>Register</h2>
            <p class="subtitle">Join the Campus Intelligence System</p>
            
            {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div style="background:#fee2e2;color:#991b1b;padding:0.75rem;border-radius:6px;margin-bottom:1rem;font-size:0.9rem;">{{ messages[0] }}</div>
            {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="your.email@university.edu" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>
            
            <div class="auth-links">
                Already have an account? <a href="{{ url_for('web.login') }}">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>

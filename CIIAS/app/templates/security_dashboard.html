{% extends "base_dashboard.html" %}

{% block title %}Security Command{% endblock %}

{% block content %}
<div class="h-full flex flex-col md:flex-row gap-6 relative">

    <!-- Live Map Container -->
    <div class="flex-1 relative rounded-xl overflow-hidden glass shadow-2xl border border-slate-600">
        <div id="securityMap" class="w-full h-full z-0"></div>

        <!-- Live Status Overlay -->
        <div
            class="absolute top-4 right-4 z-[400] glass px-4 py-2 rounded-lg text-xs font-bold text-green-400 flex items-center shadow-lg">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse mr-2"></span>
            LIVE MONITORING
        </div>
    </div>

    <!-- Incident Feed Panel -->
    <div class="w-full md:w-80 flex flex-col gap-4">
        <!-- Stats Cards -->
        <div class="grid grid-cols-2 gap-4">
            <div class="glass p-4 rounded-xl text-center">
                <p class="text-xs text-gray-400 uppercase">Active</p>
                <p class="text-2xl font-bold text-red-500" id="activeCount">0</p>
            </div>
            <div class="glass p-4 rounded-xl text-center">
                <p class="text-xs text-gray-400 uppercase">Resolved</p>
                <p class="text-2xl font-bold text-green-500" id="resolvedCount">0</p>
            </div>
        </div>

        <!-- Feed List -->
        <div class="flex-1 glass rounded-xl overflow-hidden flex flex-col">
            <div class="p-4 border-b border-slate-700 font-bold flex justify-between items-center">
                <span>Incident Feed</span>
                <i class="fas fa-satellite-dish text-primary animate-pulse"></i>
            </div>

            <div id="incidentFeed" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Incidents will be injected here -->
                <div class="text-center text-gray-500 text-sm py-8">Waiting for alerts...</div>
            </div>
        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
    // Initialize Map
    const map = L.map('securityMap').setView([33.6518, 73.1566], 18); // Default to CUI coordinates
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    const markers = {};

    // Socket Events
    socket.on('new_incident', (data) => {
        addIncidentMarker(data);
        addIncidentCard(data);
        updateStats();
        // Play alert sound
        new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play().catch(() => { });
    });

    socket.on('incident_update', (data) => {
        // Update marker/card status logic
    });

    function addIncidentMarker(data) {
        if (!data.lat || !data.lng) return;

        const iconColor = data.severity === 'HIGH' ? 'red' : 'orange';

        const marker = L.marker([data.lat, data.lng], {
            icon: L.divIcon({
                className: 'custom-div-icon',
                html: `<div style="background-color: ${iconColor}; width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 10px ${iconColor};"></div>`,
                iconSize: [12, 12],
                iconAnchor: [6, 6]
            })
        }).addTo(map);

        marker.bindPopup(`<b>${data.type}</b><br>${data.description}`);
        markers[data.id] = marker;
    }

    function addIncidentCard(data) {
        const feed = document.getElementById('incidentFeed');
        const card = document.createElement('div');
        card.className = `p-3 rounded-lg bg-slate-800 border-l-4 ${data.severity === 'HIGH' ? 'border-red-500' : 'border-yellow-500'} animate-fade-in-up`;
        card.innerHTML = `
            <div class="flex justify-between items-start">
                <span class="font-bold text-sm text-gray-200">${data.type}</span>
                <span class="text-[10px] text-gray-500">${new Date().toLocaleTimeString()}</span>
            </div>
            <p class="text-xs text-gray-400 mt-1 line-clamp-2">${data.description}</p>
        `;
        feed.insertBefore(card, feed.firstChild);
    }

    function updateStats() {
        const count = document.getElementById('activeCount');
        count.innerText = parseInt(count.innerText) + 1;
    }

    // Load initial data (Optional: Fetch from API first)
</script>

<style>
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .animate-fade-in-up {
        animation: fadeInUp 0.3s ease-out;
    }
</style>
{% endblock %}

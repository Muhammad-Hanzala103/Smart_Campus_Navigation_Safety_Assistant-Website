{% extends "base_dashboard.html" %}

{% block title %}404 - Signal Lost{% endblock %}

{% block content %}
<div class="h-[70vh] flex flex-col items-center justify-center text-center page-enter">
    <div class="relative mb-12" data-aos="zoom-in">
        <div class="text-[12rem] font-black opacity-10 leading-none select-none">404</div>
        <div class="absolute inset-0 flex items-center justify-center">
            <i class="fas fa-satellite-dish text-8xl text-primary animate-pulse"></i>
        </div>
    </div>

    <h1 class="text-4xl font-black text-white mb-4 tracking-tight">Intelligence Signal Lost</h1>
    <p class="text-gray-400 max-w-md mx-auto mb-8">
        The node you are looking for has been decommissioned or moved to a secure sector.
        Verify the coordinates and try again.
    </p>

    <div class="flex gap-4">
        <a href="{{ url_for('web.dashboard') }}"
            class="px-8 py-3 bg-primary hover:bg-indigo-600 rounded-2xl font-bold transition-all transform hover:scale-105">
            Return to Command Center
        </a>
        <button onclick="history.back()"
            class="px-8 py-3 bg-white/5 hover:bg-white/10 rounded-2xl font-bold border border-white/10 transition-all">
            Previous Log
        </button>
    </div>
</div>
{% endblock %}

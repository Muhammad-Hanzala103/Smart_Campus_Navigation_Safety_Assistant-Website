<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIIAS - 2FA Authorization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">
    <div class="bg-mesh"></div>

    <div class="w-full max-w-md relative">
        <div class="glass p-10 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
            <div class="text-center mb-10">
                <div
                    class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-indigo-500/20 mb-6">
                    <i class="fas fa-lock-keyhole text-3xl text-white"></i>
                </div>
                <h1 class="text-3xl font-black text-white tracking-tight mb-2">2FA Secure Access</h1>
                <p class="text-gray-400 text-sm font-medium">Verify your second identity factor</p>
                <div class="mt-4 px-4 py-2 bg-indigo-500/10 border border-indigo-500/20 rounded-xl">
                    <p class="text-[10px] text-indigo-400 font-black uppercase tracking-widest">
                        Method: {{ user.twofactor_method.upper() if user.twofactor_method != 'both' else 'AUTHENTICATOR
                        OR EMAIL' }}
                    </p>
                </div>
            </div>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div
                class="bg-rose-500/10 border border-rose-500/20 text-rose-500 p-4 rounded-xl text-xs font-bold mb-6 flex items-center gap-3">
                <i class="fas fa-circle-exclamation text-lg"></i> {{ messages[0] }}
            </div>
            {% endif %}
            {% endwith %}

            <form method="POST" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest ml-1">Authorization
                        Token</label>
                    <div class="relative">
                        <i class="fas fa-shield-check absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                        <input type="text" name="token" required maxlength="6"
                            class="w-full bg-slate-900/50 border border-white/5 rounded-2xl pl-12 pr-4 py-4 text-white placeholder:text-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all font-medium text-center tracking-[0.5em] text-xl"
                            placeholder="••••••">
                    </div>
                </div>

                <button type="submit"
                    class="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-black rounded-2xl hover:shadow-lg hover:shadow-indigo-500/30 transform hover:-translate-y-1 transition-all uppercase tracking-widest text-sm">
                    Complete Authorization
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-white/5 text-center">
                <a href="{{ url_for('web.login') }}"
                    class="text-xs font-bold text-gray-400 hover:text-white transition-colors">
                    Cancel Authorization
                </a>
            </div>
        </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNSMS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background: #343a40; color: white; }
        .sidebar a { color: rgba(255,255,255,.8); text-decoration: none; padding: 10px 20px; display: block; }
        .sidebar a:hover { background: #495057; color: white; }
        .sidebar a.active { background: #007bff; color: white; }
        .content { padding: 20px; }
    </style>
</head>
<body>
    <div class="d-flex">
        {% if session.get('user_id') %}
        <div class="sidebar col-md-2 d-none d-md-block">
            <h3 class="p-3">CNSMS</h3>
            <a href="{{ url_for('web.dashboard') }}" class="{{ 'active' if request.endpoint == 'web.dashboard' }}">Dashboard</a>
            <a href="{{ url_for('web.map_editor') }}" class="{{ 'active' if request.endpoint == 'web.map_editor' }}">Map Editor</a>
            <a href="{{ url_for('web.incidents') }}" class="{{ 'active' if request.endpoint == 'web.incidents' }}">Incidents</a>
            <a href="{{ url_for('web.bookings') }}" class="{{ 'active' if request.endpoint == 'web.bookings' }}">Bookings</a>
            <a href="{{ url_for('web.logout') }}">Logout</a>
        </div>
        {% endif %}
        <div class="col p-0">
            {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-warning m-3">{{ messages[0] }}</div>
            {% endif %}
            {% endwith %}
            <div class="content">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

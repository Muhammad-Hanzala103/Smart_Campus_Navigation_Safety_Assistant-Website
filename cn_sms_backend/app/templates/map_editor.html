{% extends "base.html" %}

{% block content %}
<h2>Map Editor</h2>
<div class="row">
    <div class="col-md-9">
        <div id="map-container" style="position: relative; border: 2px solid #333; height: 600px; background: #ddd;">
            <p class="text-center p-5 text-muted">Map Image will load here (Placeholder mode)</p>
            <!-- Nodes will be rendered here via JS -->
        </div>
    </div>
    <div class="col-md-3">
        <div class="card">
            <div class="card-header">Add Node</div>
            <div class="card-body">
                <form id="nodeForm">
                    <div class="mb-2">
                        <label>Name</label>
                        <input type="text" id="nodeName" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label>Description</label>
                        <input type="text" id="nodeDesc" class="form-control">
                    </div>
                    <div class="mb-2">
                        <label>Type</label>
                        <select id="nodeType" class="form-control">
                            <option value="hallway">Hallway</option>
                            <option value="room">Room</option>
                            <option value="exit">Exit</option>
                            <option value="gate">Gate</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Save Node (Manual)</button>
                </form>
                <hr>
                <p class="small text-muted">Click on map to add node at coordinates.</p>
            </div>
        </div>
        <div class="mt-3">
            <h5>Nodes List</h5>
            <ul id="nodesList" class="list-group" style="max-height: 300px; overflow-y: auto;">
                <!-- List -->
            </ul>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const mapContainer = document.getElementById('map-container');
    const nodesList = document.getElementById('nodesList');
    let nodes = [];

    function fetchNodes() {
        fetch('/api/map/')
            .then(res => res.json())
            .then(data => {
                nodes = data.nodes;
                renderNodes();
            });
    }

    function renderNodes() {
        // Clear existing dots
        document.querySelectorAll('.node-dot').forEach(e => e.remove());
        nodesList.innerHTML = '';

        nodes.forEach(node => {
            // Render on map
            const dot = document.createElement('div');
            dot.className = 'node-dot';
            dot.style.position = 'absolute';
            dot.style.left = node.x + 'px';
            dot.style.top = node.y + 'px';
            dot.style.width = '10px';
            dot.style.height = '10px';
            dot.style.backgroundColor = 'red';
            dot.style.borderRadius = '50%';
            dot.title = node.name;
            dot.style.cursor = 'pointer';
            mapContainer.appendChild(dot);

            // Render in list
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = `${node.name} <button class="btn btn-sm btn-danger" onclick="deleteNode(${node.id})">X</button>`;
            nodesList.appendChild(li);
        });
    }

    function deleteNode(id) {
        if (confirm('Delete node?')) {
            fetch(`/api/map/nodes/${id}`, { method: 'DELETE' })
                .then(() => fetchNodes());
        }
    }

    // Click map to add
    mapContainer.addEventListener('click', function (e) {
        const rect = mapContainer.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const name = prompt("Enter Node Name:");
        if (name) {
            const desc = prompt("Description:");
            const type = "hallway"; // simplified

            fetch('/api/map/nodes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, x, y, description: desc, node_type: type })
            }).then(() => fetchNodes());
        }
    });

    fetchNodes();
</script>
{% endblock %}

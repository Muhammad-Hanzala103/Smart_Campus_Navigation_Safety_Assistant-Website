{% extends "base.html" %}

{% block content %}
<h1>Room Bookings</h1>
<button onclick="document.getElementById('booking-modal').classList.add('active')">New Booking</button>

<table id="bookings-table" style="margin-top:20px">
    <thead>
        <tr>
            <th>Room</th>
            <th>Start</th>
            <th>End</th>
            <th>Reason</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<!-- Booking Modal -->
<div id="booking-modal" class="modal">
    <div class="modal-content">
        <span class="close-modal"
            onclick="document.getElementById('booking-modal').classList.remove('active')">&times;</span>
        <h3>Request Booking</h3>
        <form id="booking-form">
            <select id="b-room" required>
                <!-- Demo IDs -->
                <option value="1">Conference Room A</option>
                <option value="2">Lecture Hall 1</option>
            </select>
            <input type="datetime-local" id="b-start" required>
            <input type="datetime-local" id="b-end" required>
            <input type="text" id="b-reason" placeholder="Reason">
            <button type="submit">Submit Request</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('booking-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            room_id: document.getElementById('b-room').value,
            start_time: document.getElementById('b-start').value,
            end_time: document.getElementById('b-end').value,
            reason: document.getElementById('b-reason').value
        };
        try {
            await apiCall('/api/bookings', 'POST', data);
            window.location.reload();
        } catch (err) { alert(err.message); }
    });
</script>
{% endblock %}

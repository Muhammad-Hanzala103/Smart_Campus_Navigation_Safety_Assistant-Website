{% extends "base.html" %}

{% block title %}Map Editor - KICSIT{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    .editor-container {
        display: flex;
        height: calc(100vh - 64px);
    }

    #editor-map {
        flex: 1;
        z-index: 1;
        cursor: crosshair;
    }

    .sidebar {
        width: 300px;
        padding: 1rem;
        background: white;
        border-left: 1px solid #ddd;
        overflow-y: auto;
    }

    .node-list-item {
        padding: 0.5rem;
        border-bottom: 1px solid #eee;
        cursor: pointer;
    }

    .node-list-item:hover {
        background: #f8f9fa;
    }
</style>
{% endblock %}

{% block content %}
<div class="editor-container">
    <div id="editor-map"></div>
    <div class="sidebar">
        <h3>Node Editor</h3>
        <p class="text-muted small">Click map to add node. Click node to delete.</p>
        <div id="node-list">Loading...</div>
    </div>
</div>

<!-- Modal for New Node -->
<div class="modal fade" id="nodeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Map Node</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="nodeForm">
                    <input type="hidden" id="nodeLat">
                    <input type="hidden" id="nodeLng">
                    <div class="mb-3">
                        <label>Name</label>
                        <input type="text" id="nodeName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Description</label>
                        <textarea id="nodeDesc" class="form-control"></textarea>
                    </div>
                    <div class="mb-3">
                        <label>Type</label>
                        <select id="nodeType" class="form-select">
                            <option value="general">General</option>
                            <option value="entry">Entrance</option>
                            <option value="exit">Exit</option>
                            <option value="stairs">Stairs</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="saveNode()">Save Node</button>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // KICSIT Center
    const LAT = 33.6515;
    const LNG = 73.1565;

    const map = L.map('editor-map').setView([LAT, LNG], 18);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: 'OSM'
    }).addTo(map);

    let nodesLayer = L.layerGroup().addTo(map);
    let tempMarker = null;
    const modal = new bootstrap.Modal(document.getElementById('nodeModal'));

    // Load Nodes
    async function loadNodes() {
        const res = await fetch('/api/map/nodes');
        const data = await res.json();
        nodesLayer.clearLayers();
        const list = document.getElementById('node-list');
        list.innerHTML = '';

        data.nodes.forEach(n => {
            // Marker
            const marker = L.circleMarker([n.x, n.y], {
                color: 'blue', radius: 6
            }).bindPopup(`<b>${n.name}</b><br><button class="btn btn-sm btn-danger" onclick="deleteNode(${n.id})">Delete</button>`);

            nodesLayer.addLayer(marker);

            // List Item
            list.innerHTML += `<div class="node-list-item" onclick="map.flyTo([${n.x}, ${n.y}], 19)">
                <strong>${n.name}</strong><br><small>${n.desc}</small>
            </div>`;
        });
    }

    // Map Click -> Add Node
    map.on('click', e => {
        document.getElementById('nodeLat').value = e.latlng.lat;
        document.getElementById('nodeLng').value = e.latlng.lng;
        document.getElementById('nodeName').value = '';
        modal.show();
    });

    // Save Node
    async function saveNode() {
        const name = document.getElementById('nodeName').value;
        const x = document.getElementById('nodeLat').value;
        const y = document.getElementById('nodeLng').value;
        const desc = document.getElementById('nodeDesc').value;
        const type = document.getElementById('nodeType').value;

        if (!name) return alert('Name required');

        await fetch('/api/map/nodes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, x, y, description: desc, type })
        });

        modal.hide();
        loadNodes();
    }

    // Delete Node
    window.deleteNode = async function (id) {
        if (confirm('Delete this node?')) {
            await fetch(`/api/map/nodes/${id}`, { method: 'DELETE' });
            loadNodes();
        }
    }

    loadNodes();
</script>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<h1>Map Editor</h1>
<p>Click on the map to add a node (Admin only). Click on nodes to edit.</p>

<div id="map-container" class="map-container">
    <img src="/static/img/map.svg" style="width: 100%; height: 100%; object-fit: cover;">
    <!-- Nodes injected by JS -->
</div>

<!-- Node Modal -->
<div id="node-modal" class="modal">
    <div class="modal-content">
        <span class="close-modal"
            onclick="document.getElementById('node-modal').classList.remove('active')">&times;</span>
        <h3>Manage Node</h3>
        <form onsubmit="saveNode(event)">
            <input type="hidden" id="node-id">
            <input type="hidden" id="node-x">
            <input type="hidden" id="node-y">
            <input type="text" id="node-name" placeholder="Node Name" required>
            <textarea id="node-desc" placeholder="Description"></textarea>
            <button type="submit">Save</button>
            <button type="button" class="btn-danger" style="margin-top:10px" onclick="deleteNode()">Delete</button>
        </form>
    </div>
</div>
{% endblock %}
